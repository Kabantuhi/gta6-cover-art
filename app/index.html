<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neon Coast Cover Studio</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Neon Coast Cover Studio</h1>
    <p class="subtitle">Turn your photo into a GTA 6-style cover</p>
  </header>

  <main class="layout">
    <section class="controls" aria-label="Cover controls">
      <div class="card">
        <h2>Photo</h2>
        <div class="button-row">
          <button type="button" data-sample="boulevard">Boulevard</button>
          <button type="button" data-sample="pier">Pier</button>
        </div>
        <label class="upload" for="photo-file">Upload your own photo
          <input type="file" id="photo-file" accept="image/*">
        </label>
      </div>

      <div class="card">
        <h2>Caption</h2>
        <label for="title">Main caption</label>
        <input type="text" id="title" value="SUNSET HEIST" maxlength="60" autocomplete="off">
        <label for="accent">Script accent line</label>
        <input type="text" id="accent" value="Vice City nights" maxlength="60" autocomplete="off">
      </div>

      <div class="card">
        <h2>Size</h2>
        <div class="sizes" role="radiogroup" aria-label="Export size">
          <label><input type="radio" name="size" value="square"> Square 1080&times;1080</label>
          <label><input type="radio" name="size" value="portrait"> Portrait 1080&times;1350</label>
          <label><input type="radio" name="size" value="wide" checked> Wide 1920&times;1080</label>
        </div>
      </div>

      <button type="button" id="export" class="export-btn">Export PNG</button>
      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="preview" aria-label="Cover preview">
      <p class="preview-label">Live preview</p>
      <canvas id="cover" width="1920" height="1080"></canvas>
    </section>
  </main>

  <footer class="site-footer">
    <p>Works fully offline — your photo never leaves the browser.</p>
  </footer>
</body>
</html>
